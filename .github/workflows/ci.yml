# Fast gate on a real Mac (Apple silicon): what a pull request must pass, nothing that needs the real Pi or a model.
# On every pull request and push to main; changes to docs/, site/ or Markdown at the top level skip it
# (skills are Markdown too, so `*.md`, not `**/*.md`). The heavy parts are in heavy.yml.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'site/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', 'site/**', '*.md']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request replaces its running check; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the app's build number counts commits
      - uses: actions/cache@v4
        with:
          path: app/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('app/Package.swift', 'app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select latest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          swift --version
      - name: Translations and script tests
        run: |
          python3 scripts/check-strings.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: swift build (all targets)
        run: |
          set +e
          swift build --package-path app > build.log 2>&1; status=$?
          tail -n 40 build.log
          echo "=== Errors (unique) ==="
          grep -E "error:" build.log | sed -E 's/^ +//' | sort -u | head -n 120
          exit $status
        shell: bash {0}
      - name: PippaChecks
        timeout-minutes: 15
        run: swift run --package-path app PippaChecks 2>&1
        shell: bash -o pipefail {0}
      - name: Pi RPC protocol checks
        run: swift run --package-path app PiRPCChecks
      - name: Runtime tests without the real Pi
        # The real-Pi tests (real-pi-*.test.mjs, Pi-dependent parts of shell.test.mjs) skip themselves without
        # PIPPA_PI_CLI; heavy.yml runs them.
        run: |
          node --experimental-strip-types --test $(ls runtime/pippa-tools/*.test.mjs | grep -v '/real-pi-') 2>&1 | tail -n 200
          node --test runtime/pippa-auth/*.test.mjs 2>&1 | tail -n 200
          node --experimental-strip-types --test runtime/pippa-local-server/test/autostart.test.mjs 2>&1 | tail -n 200
        shell: bash -o pipefail {0}
