# Builds and checks Pippa on a real Mac (Apple silicon).
# On every push to claude/** branches and by hand; by hand with *app* ticked it also uploads Pippa.app.
name: CI

on:
  push:
    branches: ['claude/**']
    paths-ignore: ['docs/**', 'site/**', '**/*.md']
  workflow_dispatch:
    inputs:
      app:
        description: 'Build Pippa.app and upload it as an artifact'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the app's build number counts commits
      - uses: actions/cache@v4
        with:
          path: app/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('app/Package.swift', 'app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select latest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          swift --version
      - name: Translations and release scripts
        run: |
          python3 scripts/check-strings.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: swift build (all targets)
        run: |
          set +e
          swift build --package-path app > build.log 2>&1; status=$?
          tail -n 40 build.log
          echo "=== Errors (unique) ==="
          grep -E "error:" build.log | sed -E 's/^ +//' | sort -u | head -n 120
          exit $status
        shell: bash {0}
      - name: PippaChecks
        timeout-minutes: 15
        env:
          PIPPA_OCR_FAST: '1'
        run: swift run --package-path app PippaChecks 2>&1
        shell: bash -o pipefail {0}
      - name: Web access tests (runtime/pippa-web, pi-web-access in the real Pi)
        working-directory: runtime/pippa-web
        run: npm ci --ignore-scripts && npm test 2>&1 | tail -n 200
        shell: bash -o pipefail {0}
      - name: Pi extension tests (runtime/pippa-tools, memory and context also in the pinned Pi)
        run: |
          mkdir -p .build/pi-release
          cp app/Packaging/pi-release/package.json app/Packaging/pi-release/package-lock.json .build/pi-release/
          (cd .build/pi-release && npm ci --ignore-scripts --no-fund --no-audit --loglevel=error)
          export PIPPA_PI_CLI="$PWD/.build/pi-release/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js"
          node --experimental-strip-types --test runtime/pippa-tools/*.test.mjs 2>&1 | tail -n 200
        shell: bash -o pipefail {0}
      - name: ChatGPT sign-in helper tests (runtime/pippa-auth)
        run: node --test runtime/pippa-auth/pi-auth.test.mjs 2>&1 | tail -n 200
        shell: bash -o pipefail {0}
      - name: Terminal autostart tests (runtime/pippa-local-server)
        run: node --experimental-strip-types --test runtime/pippa-local-server/test/autostart.test.mjs 2>&1 | tail -n 200
        shell: bash -o pipefail {0}
      - name: Pippa.app (ad-hoc signed)
        if: inputs.app
        run: |
          scripts/build-app.sh
          ditto -c -k --keepParent dist/Pippa.app dist/Pippa.zip
      - uses: actions/upload-artifact@v4
        if: inputs.app
        with:
          name: Pippa-app
          path: dist/Pippa.zip
          retention-days: 14
